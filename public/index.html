<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Portfolio Project Description Writer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #f6f5f2;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #26241f;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  .wrap { width: 100%; max-width: 560px; }
  .card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 2px 14px rgba(40,30,10,0.08);
    padding: 34px 36px;
  }
  .brand { font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase; color: #b5651d; font-weight: 700; margin-bottom: 6px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; color: #2a2620; font-weight: 800; }
  .subtitle { color: #706a5c; font-size: 0.9rem; margin-bottom: 26px; }
  .field-label { font-size: 0.78rem; color: #706a5c; margin-bottom: 6px; font-weight: 600; }
  input[type=text], textarea {
    width: 100%;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid #ddd6c8;
    background: #fdfcf9;
    color: #26241f;
    font-family: inherit;
    font-size: 0.95rem;
    margin-bottom: 16px;
  }
  textarea { min-height: 80px; resize: vertical; }
  input[type=text]:focus, textarea:focus { outline: none; border-color: #b5651d; }
  button.action {
    padding: 11px 24px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    background: #b5651d;
    color: #fff;
  }
  button.action:hover:not(:disabled) { background: #914f16; }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #948d7c; min-height: 1.2em; }
  .result-box {
    margin-top: 22px;
    padding: 18px 20px;
    background: #faf3e8;
    border-left: 3px solid #b5651d;
    border-radius: 6px;
    font-size: 1rem;
    line-height: 1.7;
    color: #26241f;
  }
  .footer-note { color: #948d7c; font-size: 0.78rem; text-align: center; margin-top: 22px; }
  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid #ecdfc7;
    border-top-color: #b5651d;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="brand">On-Device Portfolio Assistant</div>
      <h1>Portfolio Project Description Writer</h1>
      <p class="subtitle">Describe what you built, get a punchy portfolio-ready description.</p>

      <div class="field-label">WHAT IT DOES</div>
      <textarea id="whatInput" placeholder="e.g. tracks daily water intake and reminds you when you're behind"></textarea>
      <div class="field-label">TECH USED (comma separated)</div>
      <input type="text" id="techInput" placeholder="e.g. React Native, Firebase, Expo" />
      <button class="action" id="generateBtn">Write Description</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const whatInput = document.getElementById('whatInput');
    const techInput = document.getElementById('techInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const whatItDoes = whatInput.value.trim();
      const tech = techInput.value.trim();
      if (!whatItDoes || !tech) return;
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Writing your description...';

      try {
        const res = await fetch('/api/describe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ whatItDoes, tech }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML = `<div class="result-box">${escapeHtml(data.description)}</div>`;
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
  </script>
</body>
</html>
